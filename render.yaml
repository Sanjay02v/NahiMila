# This file belongs at the root of the Solution Git repository.
services:
  - type: web
    name: nahimila
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_MAX_RPM
        value: "12"
      - key: GEMINI_MAX_RPD
        value: "450"
      - key: GEMINI_MAX_INPUT_TPM
        value: "200000"
      - key: GEMINI_429_COOLDOWN_SECONDS
        value: "60"
      - key: GEMINI_QUOTA_SCOPE
        value: nahimila-google-project
